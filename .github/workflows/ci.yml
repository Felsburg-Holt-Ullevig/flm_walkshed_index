name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a run on main that may deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-pipeline:
    name: Verify offline pipeline
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.12.14
          architecture: x64
      - name: Install hash-locked Python environment
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements-bootstrap-win-py312.lock.txt
          python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements-win-py312.lock.txt
          python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements-package-win-py312.lock.txt
          python -m pip install --no-deps --no-build-isolation --editable pipeline
          python -m pip check
      - name: Set up Node for cross-language checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm for cross-language checks
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked Node dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run synthetic-only pipeline checks
        shell: pwsh
        run: python -m pytest pipeline/tests pipeline/tools/tests -q
      - name: Build and validate a synthetic package twice
        shell: pwsh
        run: |
          $one = python pipeline/tools/package_network.py build-synthetic --release-id "ci-synthetic-${{ github.run_id }}-${{ github.run_attempt }}-1" | ConvertFrom-Json
          $two = python pipeline/tools/package_network.py build-synthetic --release-id "ci-synthetic-${{ github.run_id }}-${{ github.run_attempt }}-2" | ConvertFrom-Json
          if ($one.graph_id -ne $two.graph_id) { throw 'Equivalent synthetic graphs produced different semantic IDs.' }
          python pipeline/tools/package_network.py validate-package --manifest "$($one.release_directory)/manifest.json"
          python pipeline/tools/package_network.py validate-package --manifest "$($two.release_directory)/manifest.json"
      - name: Verify synthetic package in Chromium
        shell: pwsh
        run: |
          python pipeline/tools/package_network.py build-synthetic --release-id synthetic-f01-task52-20261104-e
          pnpm schema:check
          pnpm test
          pnpm build
          pnpm exec playwright install chromium
          pnpm test:browser

  verify:
    name: Verify foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and check formatting
        run: pnpm lint
      - name: Typecheck and build
        run: |
          pnpm schema:check
          pnpm test
          pnpm build
      - name: Upload site artifact for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: [verify, offline-pipeline]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
